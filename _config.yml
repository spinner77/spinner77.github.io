# Site settings for Beechview Crafts
# Edit the values below, then commit. GitHub Pages rebuilds the site for you.

title: Beechview Crafts
tagline: Growing, gathering and making by hand
description: >-
  Slow making from an allotment in Buxton, Derbyshire. Plants, folklore, fibre,
  baskets and the time it really takes to make things by hand.
author: Adele
locale: en_GB
timezone: Europe/London

# Blog name (shown on the blog page and in post headers)
blog_name: Tangled Roots

# --- Address of the site -------------------------------------------------
# If your repository is called  yourname.github.io  leave baseurl empty: ""
# If it is called something else, e.g. beechview-crafts, use "/beechview-crafts"
# If you add your own domain later, set url to it and baseurl back to ""
url: "https://spinner77.github.io"
baseurl: ""

# --- Contact and social links --------------------------------------------
# Leave any of these empty ("") to hide it from the footer.
email: "beechviewcrafts@gmail.com"
instagram: "beechviewcrafts"        # just the handle, without the @
youtube: ""          # full link to the channel

# --- Tangled Roots on Substack --------------------------------------------
# Paste your Substack address between the quotes, e.g. "https://tangledroots.substack.com"
# The blog list then shows your Substack posts (checked once a day), with comments on Substack.
substack_url: "https://beechviewcrafts.substack.com"

# --- Build settings (no need to change) ----------------------------------
markdown: kramdown
permalink: /tangled-roots/:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - preview/
  - tools/
