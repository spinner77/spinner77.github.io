- name: Iris-seed pot
  status: in progress
  date: 2026-11-08
  image: ""
  alt: ""
  materials: Dried yellow flag iris seeds, an empty gravy tub, hot glue
  from_the_plot: Yellow flag iris seeds
  time: 1 hr 11 min so far
  note: Hundreds of glossy seeds placed one at a time. A lesson in patience. (Iris seeds are toxic, so this one is for pens or dried flowers, not food.)

