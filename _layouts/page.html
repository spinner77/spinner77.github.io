---
layout: default
---
<article class="wrap page">
  <header class="page-head">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
